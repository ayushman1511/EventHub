<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EventHub - Professional Event Management Platform. Organize, manage and attend events.">
  <title>EventHub — Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%238b5cf6%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>E</text></svg>">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>EventHub</h1>
      <p class="subtitle">Your professional event management platform</p>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Sign In</button>
        <button class="auth-tab" onclick="showTab('register')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-phone">Phone</label>
            <input type="tel" id="reg-phone" class="form-input" placeholder="+91 9876543210">
          </div>
          <div class="form-group">
            <label for="reg-role">Role</label>
            <select id="reg-role" class="form-input">
              <option value="participant">Participant</option>
              <option value="organizer">Organizer</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Min 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reg-btn">Create Account</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // If already logged in, redirect
    if (isLoggedIn()) window.location.href = '/dashboard.html';

    function showTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
      });
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        const data = await API.login(
          document.getElementById('login-email').value,
          document.getElementById('login-password').value
        );
        setToken(data.token);
        setUser(data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alert(err.message);
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      btn.disabled = true; btn.textContent = 'Creating account...';
      try {
        const result = await API.register({
          name: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          phone: document.getElementById('reg-phone').value,
          password: document.getElementById('reg-password').value,
          role: document.getElementById('reg-role').value,
        });
        if (result.needsApproval) {
          alert('✅ ' + result.message);
        } else {
          alert('Account created! Please sign in.');
        }
        showTab('login');
        btn.disabled = false; btn.textContent = 'Create Account';
      } catch (err) {
        alert(err.message);
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
