<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EventHub Admin Panel - Manage organizer approvals and platform settings.">
  <title>EventHub — Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%238b5cf6%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>E</text></svg>">
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div class="page-header">
        <div><h1>🛡️ Admin Panel</h1><p>Manage organizer approval requests and platform settings.</p></div>
      </div>

      <h2 class="section-title">Pending Organizer Approvals</h2>
      <div id="pending-list"></div>

      <h2 class="section-title" style="margin-top:40px">All Users</h2>
      <div id="users-list"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadAdmin() {
      if (!initPage('admin')) return;

      // Check admin role
      const user = getUser();
      if (!user || user.role !== 'admin') {
        document.querySelector('.main-content').innerHTML = `
          <div class="empty-state">
            <div class="icon">🚫</div>
            <h3>Access Denied</h3>
            <p>Only administrators can access this page.</p>
            <a href="/dashboard.html" class="btn btn-primary btn-sm">← Back to Dashboard</a>
          </div>`;
        return;
      }

      await loadPending();
      await loadAllUsers();
    }

    async function loadPending() {
      const container = document.getElementById('pending-list');
      showLoading(container);
      try {
        const pending = await API.pendingOrganizers();
        if (!pending.length) {
          showEmpty(container, '✅', 'No pending requests', 'All organizer requests have been processed.');
          return;
        }
        container.innerHTML = `
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Requested On</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${pending.map(u => `
                  <tr id="user-row-${u.id}">
                    <td><strong>${u.name}</strong></td>
                    <td>${u.email}</td>
                    <td>${u.phone || '—'}</td>
                    <td>${formatDate(u.created_at)}</td>
                    <td>
                      <div style="display:flex;gap:8px">
                        <button class="btn btn-primary btn-sm" onclick="approveOrg(${u.id})" id="approve-btn-${u.id}">✅ Approve</button>
                        <button class="btn btn-secondary btn-sm" onclick="rejectOrg(${u.id})" id="reject-btn-${u.id}" style="background:rgba(255,80,80,0.15);color:#ff5050;border-color:rgba(255,80,80,0.3)">❌ Reject</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (e) {
        showEmpty(container, '⚠️', 'Error loading requests', e.message);
      }
    }

    async function approveOrg(id) {
      const btn = document.getElementById(`approve-btn-${id}`);
      btn.disabled = true; btn.textContent = 'Approving...';
      try {
        await API.approveOrganizer(id);
        showToast('Organizer approved! They can now log in and create events.', 'success');
        const row = document.getElementById(`user-row-${id}`);
        row.style.opacity = '0.3';
        row.style.pointerEvents = 'none';
        setTimeout(() => loadPending(), 1000);
      } catch (e) {
        showToast('Failed to approve: ' + e.message, 'error');
        btn.disabled = false; btn.textContent = '✅ Approve';
      }
    }

    async function rejectOrg(id) {
      if (!confirm('Are you sure you want to reject this organizer request? This will delete their account.')) return;
      const btn = document.getElementById(`reject-btn-${id}`);
      btn.disabled = true; btn.textContent = 'Rejecting...';
      try {
        await API.rejectOrganizer(id);
        showToast('Organizer request rejected.', 'info');
        const row = document.getElementById(`user-row-${id}`);
        row.style.opacity = '0.3';
        row.style.pointerEvents = 'none';
        setTimeout(() => loadPending(), 1000);
      } catch (e) {
        showToast('Failed to reject: ' + e.message, 'error');
        btn.disabled = false; btn.textContent = '❌ Reject';
      }
    }

    async function loadAllUsers() {
      const container = document.getElementById('users-list');
      showLoading(container);
      try {
        const users = await API.getAllUsers();
        if (!users.length) {
          showEmpty(container, '👥', 'No users found', 'Platform has no registered users.');
          return;
        }
        container.innerHTML = `
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Joined</th>
                </tr>
              </thead>
              <tbody>
                ${users.map(u => `
                  <tr>
                    <td><strong>${u.name}</strong></td>
                    <td>${u.email}</td>
                    <td><span class="badge badge-${u.role === 'admin' ? 'paid' : (u.role === 'organizer' ? 'category' : 'free')}">${u.role}</span></td>
                    <td><span class="badge badge-${u.approved ? 'success' : 'warning'}">${u.approved ? 'Active' : 'Pending'}</span></td>
                    <td>${formatDate(u.created_at)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (e) {
        showEmpty(container, '⚠️', 'Error loading users', e.message);
      }
    }

    loadAdmin();
  </script>
</body>
</html>
