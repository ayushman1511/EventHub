<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EventHub Dashboard - View event statistics and manage your events.">
  <title>EventHub — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%238b5cf6%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>E</text></svg>">
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div class="page-header">
        <div><h1>Dashboard</h1><p>Welcome back! Here's what's happening.</p></div>
        <a href="/create-event.html" class="btn btn-primary" id="create-event-btn" style="display:none">➕ Create Event</a>
      </div>

      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-value" id="s-events">—</div><div class="stat-label">Total Events</div></div>
        <div class="stat-card"><div class="stat-icon">🟢</div><div class="stat-value" id="s-published">—</div><div class="stat-label">Published</div></div>
        <div class="stat-card"><div class="stat-icon">🎟️</div><div class="stat-value" id="s-rsvps">—</div><div class="stat-label">Total RSVPs</div></div>
        <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value" id="s-users">—</div><div class="stat-label">Registered Users</div></div>
      </div>

      <div class="filters-bar">
        <input type="text" class="search-input" id="search" placeholder="Search events..." oninput="filterEvents()">
        <select class="filter-select" id="filter-category" onchange="filterEvents()">
          <option value="">All Categories</option>
          <option value="conference">Conference</option>
          <option value="workshop">Workshop</option>
          <option value="meetup">Meetup</option>
          <option value="concert">Concert</option>
          <option value="sports">Sports</option>
          <option value="webinar">Webinar</option>
          <option value="other">Other</option>
        </select>
        <select class="filter-select" id="filter-status" onchange="filterEvents()">
          <option value="">All Status</option>
          <option value="published">Published</option>
          <option value="draft">Draft</option>
          <option value="cancelled">Cancelled</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <h2 class="section-title">Events</h2>
      <div class="events-grid" id="events-grid"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let allEvents = [];

    async function loadDashboard() {
      if (!initPage('dashboard')) return;

      // Show Create Event button only for organizers
      const user = getUser();
      if (user && (user.role === 'organizer' || user.role === 'admin')) {
        document.getElementById('create-event-btn').style.display = '';
      }

      // Load stats
      try {
        const stats = await API.stats();
        document.getElementById('s-events').textContent = stats.events.total_events || 0;
        document.getElementById('s-published').textContent = stats.events.published_events || 0;
        document.getElementById('s-rsvps').textContent = stats.rsvps.total_rsvps || 0;
        document.getElementById('s-users').textContent = stats.users.total_users || 0;
      } catch (e) { console.warn('Stats failed:', e); }

      // Load events
      const grid = document.getElementById('events-grid');
      showLoading(grid);
      try {
        allEvents = await API.getEvents();
        renderEvents(allEvents);
      } catch (e) {
        showEmpty(grid, '⚠️', 'Error loading events', e.message);
      }
    }

    function renderEvents(events) {
      const grid = document.getElementById('events-grid');
      if (!events.length) {
        const user = getUser();
        const isOrg = user && (user.role === 'organizer' || user.role === 'admin');
        showEmpty(grid, '📅', 'No events found',
          isOrg ? 'Create your first event to get started!' : 'No events available yet. Check back soon!',
          isOrg ? '<a href="/create-event.html" class="btn btn-primary btn-sm">➕ Create Event</a>' : '');
        return;
      }
      grid.innerHTML = events.map(renderEventCard).join('');
    }

    function filterEvents() {
      const search = document.getElementById('search').value.toLowerCase();
      const category = document.getElementById('filter-category').value;
      const status = document.getElementById('filter-status').value;
      const filtered = allEvents.filter(e => {
        if (search && !e.title.toLowerCase().includes(search) && !(e.city||'').toLowerCase().includes(search)) return false;
        if (category && e.category !== category) return false;
        if (status && e.status !== status) return false;
        return true;
      });
      renderEvents(filtered);
    }

    loadDashboard();
  </script>
</body>
</html>
