<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Event details, RSVP and attendee information on EventHub.">
  <title>EventHub — Event Details</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%238b5cf6%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>E</text></svg>">
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div id="event-content"><div class="loading-center"><div class="spinner"></div></div></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const eventId = new URLSearchParams(window.location.search).get('id');
    let currentEvent = null;
    let myRsvp = null;

    async function loadEvent() {
      if (!initPage('')) return;
      if (!eventId) { document.getElementById('event-content').innerHTML = '<p>No event ID provided.</p>'; return; }

      const container = document.getElementById('event-content');
      try {
        currentEvent = await API.getEvent(eventId);
        try { myRsvp = await API.myRsvp(eventId); } catch(e) { myRsvp = null; }
        renderEventDetail();
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Event not found</h3><p>${err.message}</p><a href="/dashboard.html" class="btn btn-primary btn-sm">← Back to Dashboard</a></div>`;
      }
    }

    function renderEventDetail() {
      const e = currentEvent;
      const icon = CATEGORY_ICONS[e.category] || '📌';
      const pct = e.capacity > 0 ? Math.min(100, Math.round((e.confirmed_count / e.capacity) * 100)) : 0;
      const isFull = e.confirmed_count >= e.capacity;
      const user = getUser();
      const isOrganizer = user && user.id === e.organizer_id;

      let rsvpBtnHtml = '';
      if (myRsvp && myRsvp.status !== 'cancelled') {
        rsvpBtnHtml = `
          <div style="margin-bottom:16px;padding:14px;background:rgba(34,197,94,0.1);border-radius:var(--radius);text-align:center">
            <div style="font-weight:600;color:var(--success);margin-bottom:4px">✓ You're ${myRsvp.status}</div>
            <div style="font-size:12px;color:var(--text-muted)">Registered ${formatDate(myRsvp.registered_at)}</div>
          </div>
          <button class="btn btn-danger btn-block btn-sm" onclick="cancelRsvp()">Cancel RSVP</button>`;
      } else {
        rsvpBtnHtml = `<button class="btn btn-primary btn-block" onclick="doRsvp()" ${isFull ? '' : ''}>${isFull ? '📋 Join Waitlist' : '🎟️ RSVP Now'}</button>`;
      }

      let attendeesHtml = '';
      if (isOrganizer) {
        attendeesHtml = `<div class="detail-section"><h2>👥 Attendees</h2><div id="attendees-list"><div class="loading-center"><div class="spinner"></div></div></div></div>`;
      }

      let actionsHtml = '';
      if (isOrganizer) {
        actionsHtml = `
          <div style="display:flex;gap:8px;margin-top:12px">
            ${e.status === 'draft' ? `<button class="btn btn-success btn-sm" onclick="publishEvent()">Publish</button>` : ''}
            ${e.status === 'published' ? `<button class="btn btn-secondary btn-sm" onclick="cancelEvent()">Cancel Event</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteEvent()">Delete</button>
          </div>`;
      }

      document.getElementById('event-content').innerHTML = `
        <div class="page-header">
          <div><h1>${e.title}</h1><p>Organized by ${e.organizer_name}</p></div>
          <a href="/dashboard.html" class="btn btn-secondary">← Back</a>
        </div>
        <div class="event-detail-banner">${e.banner_url ? `<img src="${e.banner_url}" alt="${e.title}">` : icon}</div>
        <div class="detail-grid">
          <div>
            <div class="detail-section">
              <h2>📋 About</h2>
              <p style="color:var(--text-secondary);line-height:1.8">${e.description || 'No description provided.'}</p>
            </div>
            <div class="detail-section">
              <h2>ℹ️ Details</h2>
              <div class="detail-info-grid">
                <div class="detail-info-item"><div class="label">Date</div><div class="value">${formatDate(e.start_time)}</div></div>
                <div class="detail-info-item"><div class="label">Time</div><div class="value">${formatTime(e.start_time)} — ${formatTime(e.end_time)}</div></div>
                <div class="detail-info-item"><div class="label">Venue</div><div class="value">${e.venue_name}</div></div>
                <div class="detail-info-item"><div class="label">Location</div><div class="value">${e.address || ''}, ${e.city}${e.state ? ', '+e.state : ''}</div></div>
                <div class="detail-info-item"><div class="label">Category</div><div class="value"><span class="badge badge-category">${e.category}</span></div></div>
                <div class="detail-info-item"><div class="label">Ticket</div><div class="value"><span class="badge badge-${e.is_paid?'paid':'free'}">${e.is_paid ? '₹'+e.ticket_price : 'Free'}</span></div></div>
                <div class="detail-info-item"><div class="label">Status</div><div class="value"><span class="badge badge-${e.status}">${e.status}</span></div></div>
                <div class="detail-info-item"><div class="label">Tags</div><div class="value">${e.tags || '—'}</div></div>
              </div>
            </div>
            ${attendeesHtml}
          </div>
          <div>
            <div class="rsvp-card">
              <h3>🎟️ Registration</h3>
              <div class="capacity-info">
                <div class="capacity-text"><span>${e.confirmed_count} registered</span><span>${e.capacity} capacity</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div style="text-align:center;margin-top:8px;font-size:12px;color:var(--text-muted)">${e.capacity - e.confirmed_count} spots remaining</div>
              </div>
              ${rsvpBtnHtml}
              ${actionsHtml}
            </div>
          </div>
        </div>`;

      if (isOrganizer) loadAttendees();
    }

    async function loadAttendees() {
      try {
        const list = await API.getAttendees(eventId);
        const el = document.getElementById('attendees-list');
        if (!list.length) { el.innerHTML = '<p style="color:var(--text-muted)">No attendees yet.</p>'; return; }
        el.innerHTML = `<div class="table-wrapper"><table>
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Registered</th></tr></thead>
          <tbody>${list.map(a => `<tr>
            <td>${a.name}</td><td>${a.email}</td><td>${a.phone||'—'}</td>
            <td><span class="badge badge-${a.status}">${a.status}</span></td>
            <td>${formatDate(a.registered_at)}</td>
          </tr>`).join('')}</tbody></table></div>`;
      } catch(e) { console.warn(e); }
    }

    async function doRsvp() {
      try {
        const result = await API.rsvp(eventId, '');
        showToast(`RSVP ${result.status}!`, 'success');
        setTimeout(() => location.reload(), 800);
      } catch(err) { showToast(err.message, 'error'); }
    }

    async function cancelRsvp() {
      if (!confirm('Cancel your RSVP?')) return;
      try {
        await API.updateRsvp(eventId, 'cancelled');
        showToast('RSVP cancelled', 'info');
        setTimeout(() => location.reload(), 800);
      } catch(err) { showToast(err.message, 'error'); }
    }

    async function publishEvent() {
      try { await API.updateEvent(eventId, { status: 'published' }); showToast('Event published!', 'success'); setTimeout(() => location.reload(), 800); } catch(e) { showToast(e.message, 'error'); }
    }
    async function cancelEvent() {
      if (!confirm('Cancel this event?')) return;
      try { await API.updateEvent(eventId, { status: 'cancelled' }); showToast('Event cancelled', 'info'); setTimeout(() => location.reload(), 800); } catch(e) { showToast(e.message, 'error'); }
    }
    async function deleteEvent() {
      if (!confirm('Permanently delete this event?')) return;
      try { await API.deleteEvent(eventId); showToast('Event deleted', 'info'); setTimeout(() => window.location.href = '/dashboard.html', 800); } catch(e) { showToast(e.message, 'error'); }
    }

    loadEvent();
  </script>
</body>
</html>
