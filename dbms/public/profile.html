<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="User Profile - EventHub">
  <title>EventHub — Profile</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%238b5cf6%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>E</text></svg>">
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div class="page-header">
        <div><h1>Profile</h1><p>Manage your account information</p></div>
        <a href="/dashboard.html" class="btn btn-secondary">← Dashboard</a>
      </div>

      <div class="detail-grid">
        <div class="card" id="profile-card">
          <div class="loading-center"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadProfile() {
      if (!initPage('profile')) return;

      const container = document.getElementById('profile-card');
      try {
        const user = await API.me();
        const initial = user.name ? user.name.charAt(0).toUpperCase() : '?';
        const roleBadgeColor = user.role === 'admin' ? 'paid' : (user.role === 'organizer' ? 'category' : 'free');

        container.innerHTML = `
          <div style="display:flex; align-items:center; gap:20px; margin-bottom:24px; padding-bottom:24px; border-bottom:1px solid var(--border)">
            <div class="user-avatar" style="width:80px; height:80px; font-size:32px">${initial}</div>
            <div>
              <h2 style="font-size:24px; font-weight:700; margin-bottom:4px">${user.name}</h2>
              <span class="badge badge-${roleBadgeColor}">${user.role}</span>
            </div>
          </div>
          <div class="detail-info-grid">
            <div class="detail-info-item"><div class="label">Email Address</div><div class="value">${user.email}</div></div>
            <div class="detail-info-item"><div class="label">Phone Number</div><div class="value">${user.phone || 'Not provided'}</div></div>
            <div class="detail-info-item"><div class="label">Account Status</div><div class="value"><span class="badge badge-success">Active</span></div></div>
            <div class="detail-info-item"><div class="label">Member Since</div><div class="value">${formatDate(user.created_at)}</div></div>
          </div>
        `;
      } catch (err) {
        showEmpty(container, '⚠️', 'Error loading profile', err.message);
      }
    }

    loadProfile();
  </script>
</body>
</html>
